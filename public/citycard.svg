<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#e6a817"/>
    </linearGradient>
  </defs>
  <!-- Card shape -->
  <rect x="14" y="4" width="100" height="120" rx="10" ry="10" fill="url(#cardBg)" stroke="url(#gold)" stroke-width="3"/>
  <!-- Inner border -->
  <rect x="22" y="12" width="84" height="104" rx="6" ry="6" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <!-- City skyline -->
  <g fill="url(#skyline)">
    <!-- Building 1 - tall tower -->
    <rect x="34" y="42" width="10" height="46" rx="1"/>
    <rect x="36" y="36" width="6" height="6" rx="1"/>
    <rect x="38" y="30" width="2" height="6"/>
    <!-- Building 2 - wide -->
    <rect x="46" y="54" width="14" height="34" rx="1"/>
    <polygon points="46,54 53,46 60,54"/>
    <!-- Building 3 - tallest (center) -->
    <rect x="62" y="38" width="12" height="50" rx="1"/>
    <polygon points="62,38 68,26 74,38"/>
    <!-- Building 4 -->
    <rect x="76" y="50" width="10" height="38" rx="1"/>
    <rect x="78" y="44" width="6" height="6" rx="1"/>
    <!-- Building 5 -->
    <rect x="88" y="58" width="8" height="30" rx="1"/>
  </g>
  <!-- Building windows -->
  <g fill="#f5c518" opacity="0.7">
    <rect x="37" y="48" width="2" height="2" rx="0.5"/>
    <rect x="40" y="48" width="2" height="2" rx="0.5"/>
    <rect x="37" y="54" width="2" height="2" rx="0.5"/>
    <rect x="40" y="54" width="2" height="2" rx="0.5"/>
    <rect x="37" y="60" width="2" height="2" rx="0.5"/>
    <rect x="40" y="60" width="2" height="2" rx="0.5"/>
    <rect x="50" y="60" width="2" height="2" rx="0.5"/>
    <rect x="54" y="60" width="2" height="2" rx="0.5"/>
    <rect x="50" y="66" width="2" height="2" rx="0.5"/>
    <rect x="54" y="66" width="2" height="2" rx="0.5"/>
    <rect x="50" y="72" width="2" height="2" rx="0.5"/>
    <rect x="54" y="72" width="2" height="2" rx="0.5"/>
    <rect x="65" y="44" width="2" height="2" rx="0.5"/>
    <rect x="69" y="44" width="2" height="2" rx="0.5"/>
    <rect x="65" y="50" width="2" height="2" rx="0.5"/>
    <rect x="69" y="50" width="2" height="2" rx="0.5"/>
    <rect x="65" y="56" width="2" height="2" rx="0.5"/>
    <rect x="69" y="56" width="2" height="2" rx="0.5"/>
    <rect x="65" y="62" width="2" height="2" rx="0.5"/>
    <rect x="69" y="62" width="2" height="2" rx="0.5"/>
    <rect x="65" y="68" width="2" height="2" rx="0.5"/>
    <rect x="69" y="68" width="2" height="2" rx="0.5"/>
    <rect x="79" y="56" width="2" height="2" rx="0.5"/>
    <rect x="83" y="56" width="2" height="2" rx="0.5"/>
    <rect x="79" y="62" width="2" height="2" rx="0.5"/>
    <rect x="83" y="62" width="2" height="2" rx="0.5"/>
    <rect x="79" y="68" width="2" height="2" rx="0.5"/>
    <rect x="91" y="64" width="2" height="2" rx="0.5"/>
    <rect x="91" y="70" width="2" height="2" rx="0.5"/>
  </g>
  <!-- Ground line -->
  <line x1="28" y1="88" x2="100" y2="88" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <!-- "城" character (simplified) -->
  <text x="64" y="106" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="bold" fill="url(#gold)">城</text>
</svg>
